user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Masquage de la version de Nginx
    server_tokens off;

    # Taille maximale des uploads (documents médicaux, ordonnances, etc.)
    client_max_body_size 25M;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Rate Limiting (Protection contre le brute force et les DoS)
    # Zone pour les requêtes API générales : 15 req/sec par IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # Zone stricte pour l'authentification (login) : 5 req/min par IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Format de réponse en cas de dépassement de limite de débit (429 Too Many Requests)
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}

