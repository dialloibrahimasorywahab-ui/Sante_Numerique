server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Routing SPA Angular : fallback sur index.html pour les routes profondes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ne jamais mettre en cache index.html (pour garantir les déploiements instantanés)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    # Cache long pour les assets hashés (JS, CSS, images, polices)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Sécurité basique
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

