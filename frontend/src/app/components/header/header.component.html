<header class="site-header no-print">
  <div class="container header-inner">
    
    <!-- Logo -->
    <a (click)="onNavigate('hero')" class="brand-logo" role="button">
      <div class="logo-icon-wrap">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
          <!-- Cross with heart -->
          <rect x="15" y="4" width="10" height="32" rx="3" fill="#055A52" />
          <rect x="4" y="15" width="32" height="10" rx="3" fill="#055A52" />
          <path d="M20 25.5C20 25.5 14 20.8 14 17.5C14 15.5 15.5 14 17.5 14C18.7 14 19.6 14.6 20 15.3C20.4 14.6 21.3 14 22.5 14C24.5 14 26 15.5 26 17.5C26 20.8 20 25.5 20 25.5Z" fill="#38BDF8" />
        </svg>
      </div>
      <div class="brand-texts">
        <div class="brand-name-row">
          <span class="brand-name-main">SANTÉ</span>
          <span class="brand-name-sub">NUMÉRIQUE</span>
        </div>
        <span class="brand-tagline">Votre santé, notre priorité</span>
      </div>
    </a>

    <!-- Center Navigation Links -->
    <nav class="nav-links" [class.open]="isMobileMenuOpen">
      <button class="nav-item active" (click)="onNavigate('hero')">Accueil</button>
      <button class="nav-item" (click)="onNavigate('services')">Services</button>
      <button class="nav-item" (click)="onNavigate('medecins')">Médecins</button>
      <button class="nav-item" (click)="onNavigate('a-propos')">À propos</button>
      <button class="nav-item" (click)="onNavigate('actualites')">Actualités</button>
      <button class="nav-item" (click)="onNavigate('contact')">Contact</button>
    </nav>

    <!-- Right Header Actions -->
    <div class="header-right">
      <a href="tel:+224620000000" class="header-phone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="phone-icon">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span>+224 620 00 00 00</span>
      </a>

      <button class="btn btn-teal btn-header-rdv" (click)="triggerBooking()">
        Prendre rendez-vous
      </button>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          @if (!isMobileMenuOpen) {
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          } @else {
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          }
        </svg>
      </button>
    </div>

  </div>
</header>
