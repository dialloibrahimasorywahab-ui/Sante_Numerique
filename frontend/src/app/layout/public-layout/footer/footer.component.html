<footer id="footer" class="site-footer no-print">
  <div class="footer-container">

    <!-- GAUCHE : Logo + Nom + Utilisateur + Slogan -->
    <div class="footer-left">
      <!-- Logo et Identité -->
      <a routerLink="/" class="footer-brand">
        <div class="footer-logo-wrap">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
            <rect x="15" y="4" width="10" height="32" rx="3" fill="#FFFFFF" />
            <rect x="4" y="15" width="32" height="10" rx="3" fill="#FFFFFF" />
            <path d="M7 20H13L16 11L21 28L25 15L27 20H33" stroke="#004D40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="footer-brand-text">
          <div class="footer-brand-name">SANTÉ NUMÉRIQUE</div>
          @if (authService.isAuthenticated() && authService.currentUser()) {
            <div class="footer-user-pill">
              <span class="user-dot"></span>
              <span class="user-name">{{ authService.currentUser()?.prenom }} {{ authService.currentUser()?.nom }}</span>
            </div>
          }
        </div>
      </a>

      <!-- Séparateur vertical -->
      <div class="footer-divider"></div>

      <!-- Slogan -->
      <div class="footer-slogan">
        Ensemble pour une santé meilleure en Guinée
      </div>
    </div>

    <!-- DROITE : Réseaux sociaux + Copyright -->
    <div class="footer-right">
      <!-- 4 Icônes réseaux sociaux circulaires blanches -->
      <div class="social-links-list">
        <!-- Facebook -->
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-circle-btn" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="#004D40" class="social-icon">
            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
          </svg>
        </a>

        <!-- YouTube -->
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-circle-btn" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="#004D40" class="social-icon">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>

        <!-- LinkedIn -->
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-circle-btn" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="#004D40" class="social-icon">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </a>

        <!-- X (Twitter) -->
        <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="social-circle-btn" aria-label="X">
          <svg viewBox="0 0 24 24" fill="#004D40" class="social-icon">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>

      <!-- Séparateur vertical -->
      <div class="footer-divider"></div>

      <!-- Copyright -->
      <div class="footer-copyright">
        © {{ currentYear }} Santé Numérique. Tous droits réservés.
      </div>
    </div>

  </div>
</footer>
